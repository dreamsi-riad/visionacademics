<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details | VISION Academics</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=Anek+Bangla:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ===== গ্লোবাল স্টাইল ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --ink: #1E2A47;
            --ink-soft: #4A5772;
            --paper: #FAF7F0;
            --paper-line: #E7DFCB;
            --card: #FFFFFF;
            --accent: #E8A33D;
            --accent-dark: #C97F1F;
            --sky: #5B8FBF;
            --green: #4C8C6B;
            --shadow: 0 10px 30px rgba(30,42,71,0.08);
            --radius: 14px;
        }
        
        body {
            font-family: 'Anek Bangla', sans-serif;
            background: var(--paper);
            color: var(--ink);
            line-height: 1.7;
            margin: 0;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* ===== নেভবার ===== */
        header.nav {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(250,247,240,0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--paper-line);
        }
        
        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            height: 64px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Baloo Da 2', sans-serif;
            font-weight: 800;
            font-size: 22px;
            color: var(--ink);
            text-decoration: none;
        }
        
        .brand .brand-logo {
            height: 64px;
            max-height: 100%;
            width: auto;
            aspect-ratio: 3.84/1;
            object-fit: contain;
        }
        
        .nav-links {
            display: flex;
            gap: 30px;
            font-weight: 600;
            font-size: 15.5px;
        }
        
        .nav-links a {
            text-decoration: none;
            color: var(--ink-soft);
            padding: 4px 0;
            position: relative;
        }
        
        .nav-links a:hover {
            color: var(--ink);
        }
        
        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -3px;
            height: 2px;
            background: var(--accent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .25s ease;
        }
        
        .nav-links a:hover::after {
            transform: scaleX(1);
        }
        
        .nav-cta {
            background: var(--ink);
            color: #fff !important;
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 14.5px;
            white-space: nowrap;
            text-decoration: none;
        }
        
        .burger {
            display: none;
            background: none;
            border: none;
            font-size: 26px;
            color: var(--ink);
            cursor: pointer;
        }
        
        @media(max-width: 860px) {
            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: var(--paper);
                flex-direction: column;
                padding: 18px 28px 26px;
                gap: 16px;
                border-bottom: 1px solid var(--paper-line);
                display: none;
            }
            .nav-links.open {
                display: flex;
            }
            .burger {
                display: block;
            }
        }
        
        /* ===== কোর্স ডিটেইলস সেকশন ===== */
        .course-detail-section {
            padding: 60px 0;
            min-height: 70vh;
        }
        
        .course-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            background: var(--card);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--paper-line);
        }
        
        @media(max-width: 768px) {
            .course-detail-grid {
                grid-template-columns: 1fr;
                padding: 25px;
                gap: 30px;
            }
        }
        
        /* ===== বাম পাশ: ছবি ===== */
        .detail-image {
            width: 100%;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(30,42,71,0.12);
        }
        
        .detail-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            aspect-ratio: 16/10;
        }
        
        /* ===== ডান পাশ: তথ্য ===== */
        .detail-content {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        
        .detail-category {
            font-family: 'Baloo Da 2', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            font-size: 13px;
            color: var(--accent-dark);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .detail-category::before {
            content: "";
            width: 18px;
            height: 2px;
            background: var(--accent-dark);
            display: inline-block;
        }
        
        .detail-title {
            font-size: clamp(28px, 3vw, 38px);
            font-weight: 700;
            color: var(--ink);
            line-height: 1.2;
            margin: 0;
        }
        
        .detail-tag {
            display: inline-block;
            font-family: 'Baloo Da 2', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: var(--green);
            background: rgba(76,140,107,0.12);
            padding: 4px 14px;
            border-radius: 999px;
            width: fit-content;
        }
        
        .detail-price {
            display: flex;
            align-items: baseline;
            gap: 15px;
            flex-wrap: wrap;
            padding: 15px 0;
            border-top: 1.5px dashed var(--paper-line);
            border-bottom: 1.5px dashed var(--paper-line);
        }
        
        .price-now {
            font-family: 'Baloo Da 2', sans-serif;
            font-weight: 800;
            font-size: 32px;
            color: #5B4FE9;
        }
        
        .price-old {
            font-family: 'Anek Bangla', sans-serif;
            font-weight: 400;
            font-size: 18px;
            color: #9AA1B5;
            text-decoration: line-through;
            text-decoration-thickness: 1.5px;
        }
        
        .detail-description {
            font-size: 17px;
            color: var(--ink-soft);
            line-height: 1.8;
        }
        
        .detail-description p {
            margin-bottom: 12px;
        }
        
        .detail-features {
            list-style: none;
            padding: 0;
            margin: 8px 0 0 0;
        }
        
        .detail-features li {
            padding: 6px 0;
            padding-left: 28px;
            position: relative;
            color: var(--ink-soft);
            font-size: 16px;
        }
        
        .detail-features li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--green);
            font-weight: 700;
            font-size: 18px;
        }
        
        .detail-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 30px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 16px;
            border: none;
            text-decoration: none;
            transition: transform .18s ease, box-shadow .18s ease;
            cursor: pointer;
        }
        
        .btn-primary {
            background: var(--accent);
            color: var(--ink);
            box-shadow: 0 8px 20px rgba(232,163,61,0.4);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(232,163,61,0.5);
        }
        
        .btn-outline {
            background: transparent;
            color: var(--ink);
            border: 1.5px solid var(--ink);
        }
        
        .btn-outline:hover {
            background: var(--ink);
            color: #fff;
        }
        
        /* ===== লোডিং স্টেট ===== */
        .loading-state {
            text-align: center;
            padding: 80px 20px;
            font-size: 18px;
            color: var(--ink-soft);
        }
        
        .loading-state .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--paper-line);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        /* ===== নট ফাউন্ড ===== */
        .not-found {
            text-align: center;
            padding: 80px 20px;
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--paper-line);
        }
        
        .not-found h2 {
            font-size: 32px;
            color: var(--ink);
            margin-bottom: 10px;
        }
        
        .not-found p {
            color: var(--ink-soft);
            margin-bottom: 20px;
        }
        
        /* ===== ফুটার ===== */
        footer {
            padding: 40px 0 30px;
            color: var(--ink-soft);
            font-size: 14.5px;
            border-top: 1px solid var(--paper-line);
            margin-top: 40px;
        }
        
        .copyright {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
        }
        
        /* ===== ব্যাক বাটন ===== */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--ink-soft);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 24px;
            transition: color .2s ease;
        }
        
        .back-link:hover {
            color: var(--ink);
        }
    </style>
</head>
<body>

    <!-- ===== নেভবার ===== -->
    <header class="nav">
        <div class="nav-inner">
            <a href="index.html" class="brand">
                <img src="https://drive.google.com/thumbnail?id=1qdX7gUF-pWOJNXO7HAEMrfwDWqDAqpsl&sz=w1000" alt="VISION Academics" class="brand-logo">
            </a>
            <nav class="nav-links" id="navLinks">
                <a href="index.html#courses">কোর্সসমূহ</a>
                <a href="index.html#why">কেন আমরা</a>
                <a href="index.html#teachers">শিক্ষকবৃন্দ</a>
                <a href="index.html#videos">ফ্রি ক্লাস</a>
                <a href="index.html#contact">যোগাযোগ</a>
            </nav>
            <a href="student-reg.html" class="nav-cta">লগইন</a>
            <button class="burger" id="burgerBtn">☰</button>
        </div>
    </header>

    <!-- ===== কোর্স ডিটেইলস ===== -->
    <section class="course-detail-section">
        <div class="container">
            <!-- ব্যাক বাটন -->
            <a href="index.html#courses" class="back-link">← সব কোর্স দেখুন</a>
            
            <div id="courseDetailContainer">
                <!-- লোডিং স্টেট -->
                <div class="loading-state" id="loadingState">
                    <div class="spinner"></div>
                    <p>কোর্সের তথ্য লোড হচ্ছে...</p>
                </div>
                
                <!-- কন্টেন্ট এখানে JS দিয়ে বসানো হবে -->
                <div id="courseContent" style="display: none;"></div>
            </div>
        </div>
    </section>

    <!-- ===== ফুটার ===== -->
    <footer>
        <div class="container">
            <p class="copyright">© ২০২৬ VISION Academics — সর্বস্বত্ব সংরক্ষিত।</p>
        </div>
    </footer>

    <script>
        // ============================================================
        // ১. ইউআরএল থেকে course স্লাগ পড়া
        // ============================================================
        function getCourseSlug() {
            const params = new URLSearchParams(window.location.search);
            return params.get('course');
        }

        // ============================================================
        // ২. লোকাল ডেটা (ডেমো)
        // ============================================================
        const COURSES_DATA = {
            'ssc-accounting-batch': {
                name: 'SSC Accounting Batch',
                category: 'SSC',
                tag: 'নতুন ব্যাচ',
                price: '৳২০০০',
                oldPrice: '৳২৭০০',
                image: 'https://drive.google.com/thumbnail?id=17fkkAF57K6-o9ycb0QE34cB-6ahV6_YX&sz=w1000',
                description: `<p><strong>SSC Accounting Batch</strong> — এসএসসি পরীক্ষার্থীদের জন্য হিসাববিজ্ঞানের সম্পূর্ণ প্রস্তুতি।</p>`,
                features: ['নিয়মিত লাইভ ক্লাস', 'পিডিএফ নোট', 'সাপ্তাহিক মডেল টেস্ট']
            },
            'bba-1st-year-full-course': {
                name: 'BBA 1st Year Full Course',
                category: 'BBA',
                tag: 'চলমান',
                price: '৳৮০০০',
                oldPrice: '৳১০৮০০',
                image: 'https://drive.google.com/thumbnail?id=1k9-NtpMEfi75UVwjWugzDDUJZ7lLk103&sz=w1000',
                description: `<p><strong>BBA 1st Year Full Course</strong> — বিবিএ ১ম বর্ষের সম্পূর্ণ কোর্স।</p>`,
                features: ['লাইভ ক্লাস', 'পিডিএফ নোট', 'সাপ্তাহিক পরীক্ষা', 'ব্যক্তিগত গাইডেন্স']
            }
            // ... বাকি কোর্সগুলো এখানে যোগ করুন
        };

        // ============================================================
        // ৩. কোর্স রেন্ডার করা
        // ============================================================
        function renderCourse() {
            const slug = getCourseSlug();
            const loadingState = document.getElementById('loadingState');
            const content = document.getElementById('courseContent');

            loadingState.style.display = 'none';

            if (!slug || !COURSES_DATA[slug]) {
                content.innerHTML = `
                    <div class="not-found">
                        <h2>😕 কোর্সটি খুঁজে পাওয়া যায়নি</h2>
                        <p>আপনি যে কোর্সটি খুঁজছেন, সেটি আমাদের ডাটাবেসে নেই।</p>
                        <a href="index.html#courses" class="btn btn-primary">সব কোর্স দেখুন</a>
                    </div>
                `;
                content.style.display = 'block';
                return;
            }

            const course = COURSES_DATA[slug];
            
            let featuresHtml = '';
            if (course.features && course.features.length > 0) {
                featuresHtml = `<ul class="detail-features">`;
                course.features.forEach(f => {
                    featuresHtml += `<li>${f}</li>`;
                });
                featuresHtml += `</ul>`;
            }

            content.innerHTML = `
                <div class="course-detail-grid">
                    <div class="detail-image">
                        <img src="${course.image}" alt="${course.name}">
                    </div>
                    <div class="detail-content">
                        <span class="detail-category">${course.category}</span>
                        <h1 class="detail-title">${course.name}</h1>
                        <span class="detail-tag">${course.tag}</span>
                        <div class="detail-price">
                            <span class="price-now">${course.price}</span>
                            <span class="price-old">${course.oldPrice}</span>
                        </div>
                        <div class="detail-description">${course.description}</div>
                        ${featuresHtml}
                        <div class="detail-actions">
                            <a href="#" class="btn btn-primary">এনরোল Now</a>
                            <a href="index.html#courses" class="btn btn-outline">সব কোর্স দেখুন</a>
                        </div>
                    </div>
                </div>
            `;
            content.style.display = 'block';
        }

        // ============================================================
        // ৪. পেজ লোড হলে রেন্ডার করা
        // ============================================================
        document.addEventListener('DOMContentLoaded', renderCourse);
    </script>
</body>
</html>
