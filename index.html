/* =========================================================
   এই ফাইলে কোনো আলাদা CONFIG অবজেক্ট বা এক্সট্রা আইডি নেই।
   প্রতিটা তথ্য (লেখা, ছবি, দাম, লিংক) সরাসরি নিচের HTML অংশে বসানো আছে।
   ========================================================= */

:root{
  --ink:#1E2A47;
  --ink-soft:#4A5772;
  --paper:#FAF7F0;
  --paper-line:#E7DFCB;
  --card:#FFFFFF;
  --accent:#E8A33D;
  --accent-dark:#C97F1F;
  --margin:#C84B4B;
  --sky:#5B8FBF;
  --green:#4C8C6B;
  --shadow:0 10px 30px rgba(30,42,71,0.08);
  --radius:14px;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}

/* ===== ফ্লোটিং WhatsApp আইকন ===== */
.wa-fab{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:9999;
  display:flex;
  align-items:center;
}
.wa-fab .wa-label{
  background:#fff;
  color:var(--ink);
  font-family:'Baloo Da 2', sans-serif;
  font-weight:700;
  font-size:14.5px;
  white-space:nowrap;
  border-radius:999px;
  box-shadow:0 10px 24px rgba(22,34,63,.18);
  max-width:0;
  opacity:0;
  padding:12px 0;
  margin-right:0;
  overflow:hidden;
  transition:max-width .35s ease, opacity .3s ease, margin-right .35s ease, padding-left .35s ease, padding-right .35s ease;
}
.wa-fab:hover .wa-label{
  max-width:220px;
  opacity:1;
  margin-right:12px;
  padding-left:18px;
  padding-right:18px;
}
.wa-fab .core{
  position:relative;
  flex:0 0 auto;
  width:58px; height:58px;
  border-radius:50%;
  background:#25D366;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 10px 24px rgba(37,211,102,.42);
  transition:transform .2s ease;
}
.wa-fab:hover .core{ transform:scale(1.06); }
.wa-fab svg{ width:28px; height:28px; fill:#fff; }
.wa-fab .ring{
  position:absolute; inset:-6px;
  border-radius:50%;
  border:1.5px dashed rgba(37,211,102,.55);
  animation:spin-slow 14s linear infinite;
}
.wa-fab .ring.ring2{
  inset:-15px;
  border-color:rgba(37,211,102,.28);
  animation-duration:20s;
  animation-direction:reverse;
}
.wa-fab .pulse{
  position:absolute; inset:0;
  border-radius:50%;
  background:#25D366;
  opacity:.55;
  animation:pulse-ring 2.2s ease-out infinite;
}
.wa-fab .badge{
  position:absolute;
  top:-2px; right:-2px;
  width:16px; height:16px;
  border-radius:50%;
  background:#FF3B30;
  border:2px solid var(--paper);
  z-index:2;
}
.wa-fab .badge::after{
  content:"";
  position:absolute; inset:0;
  border-radius:50%;
  background:#FF3B30;
  animation:wa-badge-ping 1.8s ease-out infinite;
}
@keyframes wa-badge-ping{
  0%{ transform:scale(1); opacity:.7; }
  100%{ transform:scale(2.4); opacity:0; }
}
@keyframes pulse-ring{
  0%{ transform:scale(1); opacity:.5; }
  100%{ transform:scale(1.7); opacity:0; }
}
@keyframes spin-slow{
  from{ transform:rotate(0deg); }
  to{ transform:rotate(360deg); }
}
@media (max-width:600px){
  .wa-fab{ right:16px; bottom:16px; }
  .wa-fab .core{ width:52px; height:52px; }
  .wa-fab svg{ width:25px; height:25px; }
  .wa-fab .wa-label{ display:none; }
}
body{
  margin:0;
  color:var(--ink);
  font-family:'Anek Bangla', sans-serif;
  font-size:17px;
  line-height:1.65;
  background:var(--paper);
}

h1,h2,h3{
  font-family:'Anek Bangla', sans-serif;
  margin:0;
  color:var(--ink);
  font-weight:400;
}

.eyebrow{
  font-family:'Baloo Da 2', sans-serif;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-size:13px;
  color:var(--accent-dark);
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.eyebrow::before{
  content:"";
  width:18px;
  height:2px;
  background:var(--accent-dark);
  display:inline-block;
}

a{ color:inherit; text-decoration:none; }
img{ max-width:100%; display:block; }
button{ font-family:inherit; cursor:pointer; }

.container{
  max-width:min(2300px, 100%);
  margin:0 auto;
  padding:0 clamp(18px, 2.6vw, 64px);
}

/* ---------- Navbar ---------- */
header.nav{
  position:sticky; top:0; z-index:50;
  background:rgba(250,247,240,0.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--paper-line);
}
.nav-inner{
  max-width:min(2300px, 100%);
  margin:0 auto;
  height:64px;
  padding:0 clamp(18px, 2.6vw, 64px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:'Baloo Da 2', sans-serif;
  font-weight:800;
  font-size:22px;
  line-height:1.15;
  color:var(--ink);
}
.brand .dot{
  width:12px;height:12px;border-radius:3px;
  background:var(--accent);
  transform:rotate(45deg);
  flex:none;
}
.brand .brand-logo{
  height:64px;
  max-height:100%;
  width:auto;
  aspect-ratio:3.84/1;
  object-fit:contain;
  flex:none;
}
.nav-links{
  display:flex;
  gap:30px;
  font-weight:600;
  font-size:15.5px;
}
.nav-links a{
  position:relative;
  color:var(--ink-soft);
  padding:4px 0;
}
.nav-links a:hover{ color:var(--ink); }
.nav-links a::after{
  content:"";
  position:absolute; left:0; right:0; bottom:-3px;
  height:2px; background:var(--accent);
  transform:scaleX(0); transform-origin:left;
  transition:transform .25s ease;
}
.nav-links a:hover::after{ transform:scaleX(1); }
.nav-cta{
  background:var(--ink);
  color:#fff !important;
  padding:10px 20px;
  border-radius:999px;
  font-weight:700;
  font-size:14.5px;
  white-space:nowrap;
}
.burger{ display:none; background:none; border:none; font-size:26px; color:var(--ink); }

@media(max-width:860px){
  .nav-links{
    position:absolute; top:100%; left:0; right:0;
    background:var(--paper);
    flex-direction:column;
    padding:18px 28px 26px;
    gap:16px;
    border-bottom:1px solid var(--paper-line);
    display:none;
  }
  .nav-links.open{ display:flex; }
  .burger{ display:block; }
}

/* ---------- Hero ---------- */
.hero{
  padding:32px 0 24px;
  overflow:hidden;
}
.hero-grid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:50px;
  align-items:center;
}
@media(max-width:900px){
  .hero-grid{ grid-template-columns:1fr; gap:20px; }
}
@media(max-width:720px){
  .hero{ padding:10px 0 24px; }
}
.hero + section{ padding-top:36px; }
@media(max-width:720px){
  .hero + section{ padding-top:26px; }
}
.hero h1{
  font-size:clamp(34px, 5vw, 54px);
  line-height:1.25;
  margin-top:10px;
}
.hero h1 span{
  position:relative;
  white-space:nowrap;
}
.hero p.lead{
  margin-top:8px;
  font-size:18px;
  color:var(--ink-soft);
  max-width:52ch;
}
.hero-actions{
  margin-top:10px;
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}
.hero-actions .btn{
  border-radius:10px;
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:14px 26px;
  border-radius:999px;
  font-weight:700;
  font-size:15px;
  border:none;
  transition:transform .18s ease, box-shadow .18s ease;
}
.btn-primary{
  background:var(--accent);
  color:var(--ink);
  box-shadow:0 8px 20px rgba(232,163,61,.4);
}
.btn-primary:hover{ transform:translateY(-2px); box-shadow:0 12px 26px rgba(232,163,61,.5); }
.btn-outline{
  background:transparent;
  color:var(--ink);
  border:1.5px solid var(--ink);
}
.btn-outline:hover{ background:var(--ink); color:#fff; }

.hero-stats{
  margin-top:25px;
  display:flex;
  gap:14px;
  flex-wrap:nowrap;
}
.stat-card{
  flex:1 1 0;
  min-width:0;
  background:#fff;
  border:1px solid var(--paper-line);
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:12px 10px;
  display:flex;
  align-items:center;
  gap:10px;
  opacity:0;
  transform:translateY(22px);
  transition:opacity .9s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1), box-shadow .3s cubic-bezier(.22,1,.36,1);
}
.stat-card.visible{
  opacity:1;
  transform:translateY(0);
}
.stat-icon-box{
  flex:0 0 auto;
  width:40px;
  height:40px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.stat-icon{
  width:20px;
  height:20px;
}
.stat-text{
  min-width:0;
  display:flex;
  flex-direction:column;
}
.stat-text b{
  font-family:'Baloo Da 2', sans-serif;
  font-size:20px;
  line-height:1.15;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.stat-text span{
  font-size:12px;
  color:var(--ink-soft);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
@media(max-width:480px){
  .hero-stats{ gap:6px; }
  .stat-card{ padding:8px 6px; gap:6px; border-radius:12px; }
  .stat-icon-box{ width:30px; height:30px; border-radius:8px; }
  .stat-icon{ width:15px; height:15px; }
  .stat-text b{ font-size:clamp(13px,4vw,17px); }
  .stat-text span{ font-size:clamp(8.5px,2.4vw,10.5px); }
}

/* level badges */
.hero-levels{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:14px;
  margin-bottom:22px;
}
.level-card{
  font-family:'Baloo Da 2', sans-serif;
  font-weight:800;
  font-size:clamp(26px, 3.4vw, 34px);
  line-height:1;
  text-align:center;
  padding:8px 10px;
  border-radius:10px;
  color:#fff;
  box-shadow:0 8px 18px rgba(30,42,71,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  cursor:pointer;
  transition:transform .2s ease, box-shadow .2s ease;
}
.level-card:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 22px rgba(30,42,71,.26);
}
.level-card svg{
  width:1em;
  height:1em;
  flex:0 0 auto;
  stroke:#fff;
}
.level-card.level-ssc{
  background:linear-gradient(to top, #4b0000, #e10505);
}
.level-card.level-hsc{
  background:linear-gradient(to top, #0a0059, #0011ff);
}
.level-card.level-bba{
  background:linear-gradient(to top, #003904, #00c40f);
}
@media(max-width:900px){
  .hero-levels{ margin-top:6px; }
}
@media(max-width:480px){
  .level-card{ font-size:clamp(20px, 6vw, 26px); padding:10.5px 8px; }
}

/* teacher photo carousel */
.pinboard{
  position:relative;
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:0 16px 30px rgba(30,42,71,.18);
  background:#eee;
}
.pin-track{
  display:flex;
  width:100%;
}
.pin-card{
  position:relative;
  flex:0 0 100%;
  width:100%;
}
.pin-card img{
  width:100%;
  aspect-ratio:3840/2160;
  object-fit:cover;
  display:block;
  background:#eee;
}
.pin-card .name{
  position:absolute;
  left:0; right:0; bottom:0;
  padding:16px 18px;
  background:linear-gradient(to top, rgba(30,42,71,.75), rgba(30,42,71,0));
  color:#fff;
  font-family:'Baloo Da 2', sans-serif;
  font-size:14.5px;
  font-weight:600;
}
@media(max-width:900px){
  .pinboard{ margin-top:10px; }
  .pin-card .name{ font-size:13px; padding:12px 14px; }
}

/* ---------- Section shell ---------- */
section{ padding:52px 0; }
.section-head{
  max-width:640px;
  margin-bottom:34px;
}
.section-head h2{
  font-size:clamp(28px,3.4vw,38px);
  margin-top:12px;
}
.section-head p{
  color:var(--ink-soft);
  margin-top:12px;
  font-size:16.5px;
}

/* ---------- ক্যাটাগরি কুইক-কার্ড ---------- */
.cat-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:22px;
  margin-bottom:36px;
}
.cat-card{
  display:flex;
  align-items:center;
  gap:14px;
  background:#fff;
  border-radius:16px;
  padding:14px 18px;
  border:2px solid transparent;
  box-shadow:0 8px 22px rgba(30,42,71,0.06);
  transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}
.cat-card:hover{
  transform:translateY(-4px);
  box-shadow:0 14px 30px rgba(30,42,71,0.12);
}
.cat-card.active{
  border-color:var(--cat-color, var(--ink));
  box-shadow:0 14px 30px rgba(30,42,71,0.14);
}
.cat-icon{
  flex:0 0 auto;
  width:48px;
  height:48px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.cat-icon svg{
  width:26px;
  height:26px;
}
.cat-text{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.cat-text b{
  font-size:24px;
  font-weight:800;
  color:var(--cat-color, var(--ink));
}
.cat-text span{
  font-size:13.5px;
  color:var(--ink-soft);
  line-height:1.4;
}
@media (max-width:860px){
  .cat-grid{ grid-template-columns:repeat(2, 1fr); }
}
@media (max-width:520px){
  .cat-grid{ grid-template-columns:1fr; }
  .cat-card{ padding:12px 16px; }
  .cat-text b{ font-size:21px; }
}

/* ---------- Program pills ---------- */
.pill-row{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  margin-bottom:36px;
}
.pill{
  padding:16px 32px;
  border-radius:999px;
  background:#fff;
  border:1px solid var(--paper-line);
  font-weight:700;
  font-size:18px;
  color:var(--ink-soft);
  transition:.2s ease;
}
.pill.active, .pill:hover{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}
@media (max-width:480px){
  .pill{
    padding:12px 22px;
    font-size:15.5px;
  }
}

/* ---------- Course cards ---------- */
.course-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(270px,1fr));
  gap:24px;
  scroll-margin-top:82px;
}
.course-card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow), 0 0 0 0 rgba(79,143,255,0);
  overflow:hidden;
  border:1px solid var(--paper-line);
  display:flex;
  flex-direction:column;
  transition:transform .38s cubic-bezier(.22,1,.36,1), box-shadow .38s cubic-bezier(.22,1,.36,1);
}
.course-card:hover{ transform:translateY(-9px) scale(1.015); box-shadow:0 26px 46px rgba(30,42,71,.20), 0 0 34px 6px rgba(79,143,255,.45); }
.course-card[hidden]{ display:none; }
.course-image{
  width:100%;
  aspect-ratio:16/10;
  object-fit:cover;
  background:#eee;
  display:block;
}
.course-top{
  padding:8px 20px 4px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  border-bottom:1.5px dashed var(--paper-line);
}
.course-tag{
  font-family:'Baloo Da 2', sans-serif;
  font-size:12px;
  font-weight:700;
  color:var(--green);
  background:rgba(76,140,107,.12);
  padding:4px 10px;
  border-radius:999px;
}
.course-body{ padding:6px 20px 16px; flex:1; display:flex; flex-direction:column; }
.course-body h3{
  font-size:21px;
  margin-bottom:5px;
}
.course-body p{
  color:var(--ink-soft);
  font-size:15px;
  margin:0;
  line-height:1.5;
}
.course-foot{
  margin-top:auto;
  padding-top:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.price{
  display:flex;
  flex-direction:column;
  gap:2px;
}
.price-row{
  display:flex;
  align-items:baseline;
  gap:8px;
  flex-wrap:wrap;
}
.price-now{
  font-family:'Baloo Da 2', sans-serif;
  font-weight:800;
  font-size:22px;
  color:#5B4FE9;
}
.price-old{
  font-family:'Anek Bangla', sans-serif;
  font-weight:400;
  font-size:14px;
  color:#9AA1B5;
  text-decoration:line-through;
  text-decoration-thickness:1px;
}
.price small{
  font-family:'Anek Bangla', sans-serif;
  font-weight:500;
  font-size:13px;
  color:var(--green);
}
.course-foot .btn{ padding:10px 18px; font-size:13.5px; }

@media(max-width:760px){
  .course-grid{
    display:flex;
    flex-wrap:nowrap;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    gap:16px;
    padding-bottom:10px;
    -webkit-overflow-scrolling:touch;
  }
  .course-card{
    flex:0 0 82%;
    scroll-snap-align:start;
  }
}
@media(max-width:480px){
  .course-card{ flex:0 0 88%; }
}

/* ---------- Why us ---------- */
.why-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:22px;
}
.why-card{
  background:#fff;
  border:1px solid var(--paper-line);
  border-radius:var(--radius);
  overflow:hidden;
  aspect-ratio:17/7;
  box-shadow:0 0 0 0 rgba(79,143,255,0);
  transition:transform .38s cubic-bezier(.22,1,.36,1), box-shadow .38s cubic-bezier(.22,1,.36,1);
}
.why-card:hover{ transform:translateY(-9px) scale(1.015); box-shadow:0 26px 46px rgba(30,42,71,.20), 0 0 34px 6px rgba(79,143,255,.45); }
.why-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* ---------- Free YouTube videos ---------- */
.video-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:20px;
}
.video-card{
  background:#fff;
  border:1px solid var(--paper-line);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
}
.video-thumb{
  position:relative;
  aspect-ratio:16/9;
  background:#000;
  cursor:pointer;
  overflow:hidden;
}
.video-thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .3s ease;
}
.video-thumb:hover img{ transform:scale(1.05); }
.video-thumb iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}
.video-play-btn{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:56px; height:56px;
  border-radius:50%;
  background:rgba(30,42,71,.85);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.2s ease;
}
.video-thumb:hover .video-play-btn{
  background:var(--accent);
  transform:translate(-50%,-50%) scale(1.08);
}
.video-play-btn svg{
  width:20px; height:20px;
  fill:#fff;
  margin-left:3px;
}
.video-card .video-title{
  padding:14px 16px;
  font-family:'Baloo Da 2', sans-serif;
  font-weight:600;
  font-size:14.5px;
  color:var(--ink);
}

/* ---------- Teachers ---------- */
.teacher-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:22px;
}
.teacher-card{
  background:#fff;
  border-radius:var(--radius);
  border:1px solid var(--paper-line);
  overflow:hidden;
  box-shadow:var(--shadow), 0 0 0 0 rgba(79,143,255,0);
  transition:transform .38s cubic-bezier(.22,1,.36,1), box-shadow .38s cubic-bezier(.22,1,.36,1);
}
.teacher-card:hover{ transform:translateY(-9px) scale(1.015); box-shadow:0 26px 46px rgba(30,42,71,.20), 0 0 34px 6px rgba(79,143,255,.45); }
.teacher-photo{
  width:100%;
  aspect-ratio:7/5;
  object-fit:cover;
  background:#eee;
}
.teacher-info{ padding:16px 18px 20px; }
.teacher-info .name{
  font-family:'Baloo Da 2', sans-serif;
  font-weight:700;
  font-size:17px;
}
.teacher-info .subject{
  color:var(--accent-dark);
  font-size:13.5px;
  font-weight:600;
  margin-top:3px;
}
.teacher-info .bio{
  color:var(--ink-soft);
  font-size:13.5px;
  margin-top:8px;
}

@media(max-width:760px){
  .teacher-grid{
    display:flex;
    flex-wrap:nowrap;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    gap:16px;
    padding-bottom:10px;
    -webkit-overflow-scrolling:touch;
  }
  .teacher-card{
    flex:0 0 62%;
    scroll-snap-align:start;
  }
}
@media(max-width:480px){
  .teacher-card{ flex:0 0 70%; }
}

/* ---------- Message form ---------- */
.message-box{
  max-width:640px;
  margin:0 auto;
  background:#fff;
  border:1px solid var(--paper-line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:34px 30px;
}
.message-box .section-head{ margin-bottom:26px; max-width:none; }
.form-row{ margin-bottom:16px; display:flex; flex-direction:column; gap:6px; }
.form-row label{ font-weight:600; font-size:14.5px; color:var(--ink); }
.form-row input,
.form-row textarea{
  font-family:inherit;
  font-size:15px;
  padding:12px 14px;
  border-radius:10px;
  border:1.5px solid var(--paper-line);
  background:var(--paper);
  color:var(--ink);
  outline:none;
  transition:border-color .15s ease;
}
.form-row input:focus,
.form-row textarea:focus{ border-color:var(--accent); }
.form-row textarea{ resize:vertical; min-height:100px; }
#msgSubmitBtn{ width:100%; justify-content:center; margin-top:6px; }
#msgSubmitBtn:disabled{ opacity:.6; cursor:not-allowed; }
.form-status{
  margin-top:14px;
  font-size:14.5px;
  font-weight:600;
  text-align:center;
  display:none;
}
.form-status.show{ display:block; }
.form-status.ok{ color:var(--green); }
.form-status.err{ color:var(--margin); }
